# Lo stack della bacheca: un container solo, senza immagini da costruire.
#
# Sta a parte dal container del sito di proposito: il sito resta statico e in
# sola lettura, e un difetto qui non puo' toccarlo. Caddy lo raggiunge per la
# rete `edge`, la stessa che usa gia' per Umami; la bacheca non pubblica porte
# verso l'esterno, ci si arriva solo passando da Caddy.
#
# Prima di alzarlo serve un file .env accanto a questo, che NON sta nel
# repository:
#   BACHECA_SALT=<stringa casuale lunga>
#   BACHECA_TOKEN=<password della moderazione>

services:
  bacheca:
    image: python:3.13-alpine
    container_name: bacheca
    restart: unless-stopped
    command: ["python3", "-u", "/app/bacheca.py"]
    environment:
      - BACHECA_DB=/dati/bacheca.sqlite
      - BACHECA_SALT=${BACHECA_SALT}
      - BACHECA_TOKEN=${BACHECA_TOKEN}
      - BACHECA_PORT=8090
    volumes:
      - ./bacheca.py:/app/bacheca.py:ro
      - /home/arch/bachecadati:/dati
    networks:
      - edge
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/api/salute', timeout=3).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  edge:
    external: true
